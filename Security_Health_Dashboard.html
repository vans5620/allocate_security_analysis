<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Health Monitor</title>
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f3f2ee; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --pos:#2a78d6; --neg:#e34948; --mid:#f0efec;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --good-ink:#006300;
  --accent:#2a78d6;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --pos:#3987e5; --neg:#e66767; --mid:#383835; --good-ink:#0ca30c; --accent:#3987e5;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --pos:#3987e5; --neg:#e66767; --mid:#383835; --good-ink:#0ca30c; --accent:#3987e5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:20px 24px 0;max-width:1480px;margin:0 auto}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 10px;font-weight:620}
h3{font-size:13px;margin:0 0 8px;font-weight:600;color:var(--ink-2)}
.sub{color:var(--ink-2);font-size:13px;margin-top:2px}
main{max-width:1480px;margin:0 auto;padding:12px 24px 48px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--grid);margin-top:14px;overflow-x:auto}
.tab{appearance:none;background:none;border:0;padding:10px 14px;font:inherit;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.seg{display:inline-flex;border:1px solid var(--ring);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{appearance:none;border:0;background:none;padding:7px 12px;font:inherit;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);font-weight:600}
select,input[type=search]{font:inherit;padding:7px 10px;border:1px solid var(--ring);border-radius:8px;background:var(--surface);color:var(--ink)}
label.chk{display:inline-flex;gap:6px;align-items:center;color:var(--ink-2);font-size:13px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:3fr 2fr}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g32{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:16px;min-width:0}
.tile .v{font-size:24px;font-weight:620;margin-top:2px}
.tile .l{font-size:12px;color:var(--ink-2)}
.tile .d{font-size:12px;color:var(--ink-2);margin-top:4px}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.pos{color:var(--good-ink)} .neg{color:var(--neg)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
th{font-size:12px;font-weight:600;color:var(--ink-2);position:sticky;top:0;background:var(--surface);cursor:pointer;user-select:none}
th.l,td.l{text-align:left}
tbody tr:hover{background:var(--surface-2)}
tr.click{cursor:pointer}
.tw{overflow:auto;max-height:70vh;border-radius:8px}
.name{max-width:320px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}
.tag{display:inline-block;font-size:11px;color:var(--ink-2);background:var(--surface-2);border-radius:4px;padding:1px 6px;margin-left:6px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px 2px 6px;border-radius:999px;border:1px solid var(--ring)}
.pill i{font-style:normal;width:14px;height:14px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;color:#fff;line-height:1}
.pill.Healthy i{background:var(--good)} .pill.Watch i{background:var(--warn);color:#0b0b0b} .pill.Review i{background:var(--crit)}
.pill.na i{background:var(--axis)}
.score{font-weight:620}
.delta{font-size:11px;margin-left:4px}
.flag{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--grid)}
.flag:last-child{border-bottom:0}
.flag .w{margin-left:auto;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.flag ul{margin:2px 0 0;padding-left:16px;color:var(--ink-2);font-size:12.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:4px 0 6px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend b{display:inline-block;width:14px;height:2px;border-radius:2px}
.legend b.box{height:10px;width:10px;border-radius:2px}
svg text{fill:var(--muted);font-size:11px}
.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:50;display:none;min-width:150px}
.tip .t{color:var(--ink-2);margin-bottom:4px}
.tip .r{display:flex;gap:8px;align-items:center;justify-content:space-between}
.tip .r span{display:inline-flex;gap:6px;align-items:center;color:var(--ink-2)}
.tip .r b{font-variant-numeric:tabular-nums;color:var(--ink)}
.tip .k{display:inline-block;width:12px;height:2px;border-radius:2px}
dialog{border:0;border-radius:14px;padding:0;width:min(1100px,96vw);max-height:92vh;background:var(--page);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{position:sticky;top:0;background:var(--page);padding:16px 20px;border-bottom:1px solid var(--grid);display:flex;gap:12px;align-items:flex-start;z-index:2}
.db{padding:16px 20px;display:grid;gap:12px}
.x{margin-left:auto;appearance:none;border:1px solid var(--ring);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.kv div{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.kv .l{font-size:11.5px;color:var(--ink-2)} .kv .v{font-weight:620;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--surface-2);position:relative;overflow:hidden;min-width:60px}
.bar>span{position:absolute;top:0;bottom:0;border-radius:4px}
.note{font-size:12.5px;color:var(--ink-2)}
details summary{cursor:pointer;color:var(--ink-2)}
.heat td{padding:5px 6px;font-size:12px}
.hidden{display:none!important}
.themebtn{appearance:none;border:1px solid var(--ring);background:var(--surface);color:var(--ink-2);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:12px}
</style>
</head>

// ------------------------------------------------------------------ charts
function lineChart(el,{dates,series,height=240,yfmt=v=>v.toFixed(0),baseline=null,endLabels=true,tipfmt}){
  const W=el.clientWidth||700,H=height,m={l:44,r:endLabels?118:12,t:10,b:24};
  const iw=W-m.l-m.r,ih=H-m.t-m.b,n=dates.length;
  const vals=series.flatMap(s=>s.v.filter(fin));if(!vals.length){el.innerHTML='<div class="muted">No data</div>';return}
  let lo=Math.min(...vals),hi=Math.max(...vals);if(baseline!==null){lo=Math.min(lo,baseline);hi=Math.max(hi,baseline)}
  const pad=(hi-lo)*.06||1;lo-=pad;hi+=pad;
  const X=i=>m.l+(n<2?0:i/(n-1)*iw),Y=v=>m.t+(hi-v)/(hi-lo)*ih;
  const ticks=5,step=(hi-lo)/ticks;let g="";
  for(let i=0;i<=ticks;i++){const v=lo+step*i,y=Y(v);g+=`<line x1="${m.l}" x2="${m.l+iw}" y1="${y}" y2="${y}" stroke="${css("--grid")}" stroke-width="1"/><text x="${m.l-6}" y="${y+4}" text-anchor="end">${esc(yfmt(v))}</text>`}
  if(baseline!==null)g+=`<line x1="${m.l}" x2="${m.l+iw}" y1="${Y(baseline)}" y2="${Y(baseline)}" stroke="${css("--axis")}" stroke-width="1"/>`;
  const xt=Math.min(6,n);for(let i=0;i<xt;i++){const k=Math.round(i*(n-1)/(xt-1||1));const d=new Date(dates[k]+"T00:00:00");g+=`<text x="${X(k)}" y="${H-6}" text-anchor="${i===xt-1&&!endLabels?"end":i===0?"start":"middle"}">${d.toLocaleDateString("en-IN",{month:"short",year:"2-digit"})}</text>`}
  let paths="",labels="";const ends=[];
  series.forEach(s=>{let d="",pen=false;s.v.forEach((v,i)=>{if(fin(v)){d+=(pen?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1);pen=true}else pen=false});
    paths+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    let li=s.v.length-1;while(li>0&&!fin(s.v[li]))li--; if(fin(s.v[li]))ends.push({y:Y(s.v[li]),s,v:s.v[li],x:X(li)})});
  if(endLabels){ends.sort((a,b)=>a.y-b.y);for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<14)ends[i].y=ends[i-1].y+14;
    ends.forEach(e=>{labels+=`<circle cx="${e.x}" cy="${Y(e.v)}" r="4" fill="${e.s.c}" stroke="${css("--surface")}" stroke-width="2"/><text x="${m.l+iw+8}" y="${e.y+4}" style="fill:${css("--ink-2")}">${esc(e.s.n)} ${esc(yfmt(e.v))}</text>`})}
  el.innerHTML=`<svg width="${W}" height="${H}" role="img" aria-label="${esc(series.map(s=>s.n).join(", "))}">${g}${paths}${labels}<line class="xh" y1="${m.t}" y2="${m.t+ih}" stroke="${css("--axis")}" stroke-width="1" visibility="hidden"/><rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  const svg=el.querySelector("svg"),xh=svg.querySelector(".xh"),hit=svg.querySelector("rect");
  const move=ev=>{const r=svg.getBoundingClientRect();const i=Math.max(0,Math.min(n-1,Math.round((ev.clientX-r.left-m.l)/iw*(n-1))));
    xh.setAttribute("x1",X(i));xh.setAttribute("x2",X(i));xh.setAttribute("visibility","visible");
    showTip(ev,fmtD(dates[i]),series.map(s=>[s.n,fin(s.v[i])?(tipfmt||yfmt)(s.v[i]):"—",s.c]))};
  hit.addEventListener("pointermove",move);hit.addEventListener("pointerleave",()=>{xh.setAttribute("visibility","hidden");hideTip()});
}

function divBars(el,items,{fmt=v=>pct(v,2,true),labelW=230}={}){
  // horizontal bars from a zero line; items: {label,v,sub}
  if(!items.length){el.innerHTML='<div class="muted">Nothing to show</div>';return}
  const W=el.clientWidth||600,bh=18,gap=8,H=items.length*(bh+gap)+8,valW=70;
  const max=Math.max(...items.map(i=>Math.abs(i.v)),1e-9);
  const hasNeg=items.some(i=>i.v<0),hasPos=items.some(i=>i.v>0);
  const plotL=labelW,plotW=W-labelW-valW;const zero=hasNeg&&hasPos?plotL+plotW/2:(hasNeg?plotL+plotW:plotL);
  const scale=(hasNeg&&hasPos?plotW/2:plotW)/max;
  let s="";items.forEach((it,k)=>{const y=4+k*(bh+gap),len=Math.max(2,Math.abs(it.v)*scale),x=it.v>=0?zero:zero-len;
    const col=it.v>=0?css("--pos"):css("--neg");
    s+=`<g class="hb" data-k="${k}"><rect x="0" y="${y-gap/2}" width="${W}" height="${bh+gap}" fill="transparent"/>
    <text x="${labelW-8}" y="${y+13}" text-anchor="end" style="fill:${css("--ink-2")}">${esc(it.label.length>34?it.label.slice(0,33)+"…":it.label)}</text>
    <rect x="${x}" y="${y+3}" width="${len}" height="${bh-6}" rx="4" fill="${col}"/>
    <text x="${it.v>=0?x+len+6:x-6}" y="${y+13}" text-anchor="${it.v>=0?"start":"end"}" style="fill:${css("--ink")}">${esc(fmt(it.v))}</text></g>`});
  s+=`<line x1="${zero}" x2="${zero}" y1="0" y2="${H}" stroke="${css("--axis")}"/>`;
  el.innerHTML=`<svg width="${W}" height="${H}" role="img" aria-label="bar chart">${s}</svg>`;
  el.querySelectorAll(".hb").forEach(g=>{const it=items[+g.dataset.k];

    if(it.onclick){g.style.cursor="pointer";g.addEventListener("click",it.onclick)}});
}

function spark(values,{w=90,h=22}={}){

  let d="",pen=false;values.forEach((x,i)=>{if(fin(x)){d+=(pen?"L":"M")+X(i).toFixed(1)+" "+Y(x).toFixed(1);pen=true}else pen=false});

function heatColor(v,max){

// ------------------------------------------------------------------ HOLDINGS
function holdings(){
  const cols=[["name","Security",1],["w","Weight"],["score","Score"],["status","Status",1],["r1m","1M"],["r3m","3M"],["r1y","1Y"],["r3y","3Y ann."],
    ["xb","vs Bm 1Y"],["xc","vs Cat 1Y"],["rk","Cat pctl 1Y"],["shp","Sharpe"],["mdd","Max DD"],["c","Contrib FYTD"],["rs","Risk share"],["nf","Flags"]];
  const get=(r,k)=>{const s=r.sec,R=s.rets||{},B=s.bm_rets||{},C=s.cat_rets||{};switch(k){
    case "name":return r.name;case "w":return r.w;case "score":return r.score;case "status":return r.status;
    case "r1m":return R["1M"];case "r3m":return R["3M"];case "r1y":return R["1Y"];case "r3y":return R["3Y"];
    case "xb":return fin(R["1Y"])&&fin(B["1Y"])?R["1Y"]-B["1Y"]:null;case "xc":return fin(R["1Y"])&&fin(C["1Y"])?R["1Y"]-C["1Y"]:null;
    case "rk":return (s.rank||{})["1Y"];case "shp":return r.style==="cash"?null:(s.risk||{}).sharpe;case "mdd":return (s.risk||{}).mdd;
    case "c":return r.contrib.FYTD;case "rs":return r.risk_pct;case "nf":return (r.flags||[]).length}};
  const rows=sortRows(rowsFor(),S.sort.holdings,get);
  const groups=S.sort.holdings[0]==="w";
  let body="";
  const line=r=>{const s=r.sec,R=s.rets||{};const xb=get(r,"xb"),xc=get(r,"xc"),rk=get(r,"rk");
    return `<tr class="click" data-key="${esc(r.key)}"><td class="l"><span class="name">${esc(r.name)}</span>${r.style==="stock"?`<div class="muted" style="font-size:11px">${esc(s.mcap||"—")} cap · ${esc(s.sector||"—")}</div>`:""}</td><td>${pct(r.w,2)}</td><td>${scoreCell(r)}</td><td class="l">${pill(r.status)}</td>
    <td class="${cls(R["1M"])}">${pct(R["1M"])}</td><td class="${cls(R["3M"])}">${pct(R["3M"])}</td><td class="${cls(R["1Y"])}">${pct(R["1Y"])}</td><td class="${cls(R["3Y"])}">${pct(R["3Y"])}</td>
    <td class="${cls(xb)}">${pp(xb,1)}</td><td class="${cls(xc)}">${pp(xc,1)}</td><td>${fin(rk)?rk.toFixed(0):"—"}</td><td>${num(get(r,"shp"))}</td><td>${pct(get(r,"mdd"),0)}</td>
    <td class="${cls(r.contrib.FYTD)}">${pp(r.contrib.FYTD)}</td><td>${pct(r.risk_pct,1)}</td><td>${(r.flags||[]).length?`<span title="${esc(r.flags.join("\n"))}">⚑ ${r.flags.length}</span>`:""}</td></tr>`};
  if(groups){for(const bk of BUCKET_ORDER){const g=rows.filter(r=>r.bucket===bk);if(!g.length)continue;
      const w=g.reduce((a,r)=>a+r.w,0),c=g.reduce((a,r)=>a+(r.contrib.FYTD||0),0);
      body+=`<tr><td class="l" colspan="16" style="background:var(--surface-2);font-weight:600">${esc(bk)} <span class="muted" style="font-weight:400">· ${g.length} · ${pct(w,1)} weight · ${pp(c)} pp FYTD</span></td></tr>`+g.map(line).join("")}}
  else body=rows.map(line).join("");
  $("#v-holdings").innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Holdings health — ${esc(DATA.schemes[S.scheme].name)}</h2>
   <span class="note">Returns: trailing, point-to-point (3Y annualised). vs Bm / vs Cat in percentage points. Cat pctl: 100 = best in peer group. Sharpe &amp; Max DD: 3Y weekly (or since launch if &gt;1Y). Sort by Weight to group by bucket.</span></div>
   <div class="tw" style="margin-top:10px"><table><thead><tr>${thSort("holdings",cols)}</tr></thead><tbody>${body}</tbody></table></div></div>`;
  bindSort($("#v-holdings"));bindClicks($("#v-holdings tbody"));
}

// ------------------------------------------------------------------ IMPACT

  const b=DATA.schemes[S.scheme],per=DATA.periods,rows=rowsFor();
  const get=(r,k)=>k==="name"?r.name:k==="w"?r.w:k==="rs"?r.risk_pct:k==="ratio"?(fin(r.risk_pct)&&r.w?r.risk_pct/r.w:null):k==="dsh"?(r.whatif||{}).d_sharpe:k==="dvol"?(r.whatif||{}).d_vol:k==="corr"?r.corr:r.contrib[k];
  const srt=sortRows(rows,S.sort.impact,get);
  const cols=[["name","Security",1],["w","Weight"],...per.map(p=>[p,p]),["rs","Risk share"],["ratio","Risk ÷ wt"],["corr","Corr. to rest"],["dvol","Δ vol if removed"],["dsh","Δ Sharpe if removed"]];
  const sum=k=>rows.reduce((a,r)=>a+(r.contrib[k]||0),0);

   <div class="tw" style="margin-top:10px"><table><thead><tr>${thSort("impact",cols)}</tr></thead><tbody>
   ${srt.map(r=>{const ratio=get(r,"ratio"),wi=r.whatif||{};return `<tr class="click" data-key="${esc(r.key)}"><td class="l"><span class="name">${esc(r.name)}</span><span class="tag">${esc(r.bucket)}</span></td><td>${pct(r.w,2)}</td>

     <td ${fin(ratio)&&ratio>2&&r.w>0.01?'style="font-weight:650"':""}>${fin(ratio)?ratio.toFixed(1)+"×":"—"}</td><td>${num(r.corr)}</td>
     <td>${pp(wi.d_vol)}</td><td class="${cls(-wi.d_sharpe)}">${fin(wi.d_sharpe)?(wi.d_sharpe>0?"+":"")+wi.d_sharpe.toFixed(3):"—"}</td></tr>`}).join("")}
   </tbody><tfoot>
   <tr><td class="l">Shown positions</td><td>${pct(rows.reduce((a,r)=>a+r.w,0),1)}</td>${per.map(p=>`<td>${pp(sum(p))}</td>`).join("")}<td colspan="5"></td></tr>
   ${!S.bucket&&!S.status&&!S.q?`<tr><td class="l">Exited / not-shown positions</td><td></td>${per.map(p=>`<td>${pp(b.periods[p]-sum(p))}</td>`).join("")}<td colspan="5"></td></tr>
   <tr><td class="l"><b>Scheme return (ex-cash)</b></td><td></td>${per.map(p=>`<td class="${cls(b.periods[p])}"><b>${pct(b.periods[p],2,true)}</b></td>`).join("")}<td colspan="5"></td></tr>`:""}
   </tfoot></table></div>
   <div class="note" style="margin-top:6px">Δ vol if removed (pp): negative = the position is adding volatility; positive = it is diversifying. Δ Sharpe if removed: positive (red) = the scheme's Sharpe would be higher without it; negative (green) = it improves risk-adjusted return.</div></div>`;
  // monthly heat
  const months=Object.keys(b.monthly);const top=[...rows].sort((a,c)=>c.w-a.w).slice(0,30);

   <div class="tw"><table class="heat"><thead><tr><th class="l">Security</th>${months.map(m=>`<th>${m}</th>`).join("")}</tr></thead><tbody>

   <tr><td class="l"><b>Scheme</b></td>${months.map(m=>`<td class="${cls(b.monthly[m].total)}"><b>${pct(b.monthly[m].total,2,true)}</b></td>`).join("")}</tr>

  const el=$("#riskBars");const W=el.clientWidth||500,bh=16,gp=12,H=rk.length*(bh*2+gp);const mxr=Math.max(...rk.map(r=>Math.max(r.risk_pct,r.w)),1e-6);const lw=210,pw=W-lw-60;

  const b=DATA.schemes[S.scheme];
  $("#v-method").innerHTML=`<div class="grid g2"><div class="card"><h2>Health score (0–100)</h2><div class="note">
  <p><b>Status:</b> ≥60 Healthy · 45–60 Watch · &lt;45 Review. Scores are recomputed at each of the last 12 month-ends with only the data available then, so the trend and "Δ vs last month" are like-for-like.</p>
  <p><b>Active funds</b> (ranked against the Direct-Growth funds in the same SEBI category from AMFI): 1Y rank 20%, 3Y rank 25%, 3Y Sharpe rank 20%, 3Y max-drawdown rank 10%, 6M rank 15%, 3Y information ratio vs benchmark 10%, 1Y excess over benchmark 10% (weights re-normalise when history is short). International funds are ranked within their region (US, China, EM, Asia, Global).</p>
  <p><b>Index funds &amp; ETFs:</b> half <i>vehicle quality</i> (1Y return and tracking error ranked against funds tracking the same index; else tracking difference), half <i>exposure call</i> (fund vs Nifty 500 TRI over 6M and 1Y). Broad-market trackers (Nifty 50/500) are scored on vehicle only. BSE Midcap 150 Momentum 30 funds are benchmarked to Nifty Midcap 150 TRI.</p>
  <p><b>Direct stocks &amp; InvITs:</b> relative strength vs benchmark (Nifty 500 TRI; InvITs vs Nifty REITs &amp; InvITs TRI) over 3M/6M/1Y, distance from 52-week high, and return since entry vs benchmark. Total returns include dividends / distributions.</p>
  <p><b>Gold/silver</b> are ranked within gold or silver ETFs &amp; FoFs; <b>cash</b> within liquid, or overnight &amp; 1D-rate ETFs. <b>Corporate bonds</b> are not scored (no market prices); they carry coupon accrual in contribution.</p></div></div>
  <div class="card"><h2>Impact &amp; data</h2><div class="note">
  <p><b>Contribution</b> is actual, not model: daily positions are rebuilt from the transaction statement (reconciled to the holding statement — every position matches within 2%), valued at daily NAV/close, with buys, sells, in-specie transfers and dividends as flows. Daily P&amp;L ÷ (previous value + inflows), linked geometrically, so contributions add up exactly to the scheme return. Cash is not in the files, so returns are on invested assets.</p>
  <p><b>Risk share</b> = w·(Σw)/σ² using 1Y weekly returns at current weights. <b>What-if</b> removes one position and re-weights the rest.</p>
  <p><b>Exit review</b> covers positions the model bought (≥ ₹5 L) and fully exited; client in-specie legacy stocks are excluded. Exit alpha = benchmark return − security return since exit.</p>
  <p><b>Sources:</b> AMFI (NAVs, categories), mfapi.in (NAV history), NSE Indices (official TRI), Yahoo Finance (stocks, InvITs, international ETFs converted to INR, gold/silver). International benchmarks (converted to INR daily): US funds → S&P 500 TR; China funds → Shanghai Composite (price index); emerging-market funds → MSCI ACWI (ETF proxy); Asia → MSCI Asia ex-Japan; global → MSCI ACWI.</p>
  ${b.recon.length?`<p><b>Reconciliation entries (${esc(b.name)}):</b> ${b.recon.map(r=>`${esc(r.key)} ${r.qty>0?"+":""}${num(r.qty,1)} units on ${fmtD(r.date)}`).join("; ")} — corporate actions, maturities or ISIN changes not in the transaction file, booked at cost with no P&amp;L.</p>`:""}
  <p><b>Refresh monthly:</b> drop the new Holding and Transaction Statements (Z0_9/10/11) into this folder and run <code>python3 engine/build.py</code>. A snapshot is saved to <code>snapshots/</code> each run.</p></div></div></div>`;
}

// ------------------------------------------------------------------ SECURITY CARD
function openSec(key){
  const s=DATA.secs[key];if(!s)return;const d=$("#dlg");
  const R=s.rets||{},B=s.bm_rets||{},C=s.cat_rets||{},RK=s.rank||{},RS=s.risk||{},R1=s.risk1y||{};
  const inSch=Object.entries(DATA.schemes).map(([id,b])=>({id,b,r:b.rows.find(x=>x.key===key)})).filter(x=>x.r);
  const W=["1M","3M","6M","1Y","3Y","5Y"];
  const isStock=s.style==="stock";
  const riskKV=isStock
    ?[["Volatility",pct(RS.vol)],["Sharpe",num(RS.sharpe)],["Sortino",num(RS.sortino)],["Max drawdown",pct(RS.mdd)],["Beta",num(RS.beta)],["Alpha (ann.)",pp(RS.alpha,1)+" pp"],["From 52-wk high",pct(s.from_high)],["Market cap",esc(s.mcap||"—")],["Sector",esc(s.sector||"—")]]
    :[["Volatility",pct(RS.vol)],["Sharpe",s.style==="cash"?"—":num(RS.sharpe)],["Sortino",s.style==="cash"?"—":num(RS.sortino)],["Max drawdown",pct(RS.mdd)],["Beta",num(RS.beta)],["Alpha (ann.)",pp(RS.alpha,1)+" pp"],["Tracking error",pct(RS.te)],["Information ratio",num(RS.ir)],["Up capture",num(RS.up_cap)],["Down capture",num(RS.down_cap)],["Cat. median Sharpe",num((s.cat_risk||{}).sharpe)],["Cat. median max DD",pct((s.cat_risk||{}).mdd)],["1Y tracking error",pct(R1.te)],["From 52-wk high",pct(s.from_high)],["Consistency (12M)",fin(s.consistency)?pct(s.consistency,0)+" of months ≥ median":"—"]];
  d.innerHTML=`<div class="dh"><div><div style="font-size:17px;font-weight:650">${esc(s.name)}</div>
    <div class="sub">${esc(s.bucket)}${isStock?` · <b>${esc(s.mcap||"—")} cap</b> · ${esc(s.sector||"Sector n/a")}`:""}${s.amfi_cat?" · "+esc(s.amfi_cat):""}${s.isin?" · "+esc(s.isin):""} · Benchmark: ${esc(s.bm_label)}${isStock?"":` · Peers: ${esc(s.peer_label)}${s.peer_n?" ("+s.peer_n+")":""}`}</div>
    <div class="row" style="margin-top:8px">${pill(s.status)} <span class="score" style="font-size:18px">${fin(s.score)?s.score.toFixed(0):"—"}</span><span class="muted">/100</span>
    ${fin(s.prev_score)?`<span class="muted">last month-end ${s.prev_score.toFixed(0)}</span>`:""} ${spark([...(s.hist||[]).map(x=>x.s),s.score],{w:140,h:26})}</div></div>
    <button class="x" type="button" onclick="document.getElementById('dlg').close()">Close</button></div>
  <div class="db">
   ${(s.flags||[]).length?`<div class="card"><h3>Flags</h3>${s.flags.map(f=>`<div class="flag">${pill(s.status)}<div>${esc(f)}</div></div>`).join("")}</div>`:""}
   <div class="card"><h3>Growth of 100 — last 3 years (weekly)</h3>
     <div class="legend"><span><b style="background:var(--s1)"></b>This security</span>${s.chart&&s.chart.bm?`<span><b style="background:var(--s2)"></b>${esc(s.bm_label)}</span>`:""}${s.chart&&s.chart.cat?`<span><b style="background:var(--s3)"></b>Category average</span>`:""}</div>
     <div id="secChart"></div><h3 style="margin-top:10px">Drawdown from peak</h3><div id="ddChart"></div></div>
   <div class="grid g2">
    <div class="card"><h3>Trailing returns</h3><div style="overflow-x:auto"><table><thead><tr><th class="l"></th>${W.map(w=>`<th>${w}</th>`).join("")}</tr></thead><tbody>
     <tr><td class="l">Security</td>${W.map(w=>`<td class="${cls(R[w])}">${pct(R[w])}</td>`).join("")}</tr>
     <tr><td class="l">Benchmark</td>${W.map(w=>`<td>${pct(B[w])}</td>`).join("")}</tr>
     ${isStock?"":`<tr><td class="l">Category median</td>${W.map(w=>`<td>${pct(C[w])}</td>`).join("")}</tr>`}
     <tr><td class="l">vs benchmark (pp)</td>${W.map(w=>{const x=fin(R[w])&&fin(B[w])?R[w]-B[w]:null;return `<td class="${cls(x)}">${pp(x,1)}</td>`}).join("")}</tr>
     ${isStock?"":`<tr><td class="l">Category percentile</td>${W.map(w=>`<td>${fin(RK[w])?RK[w].toFixed(0):"—"}</td>`).join("")}</tr>`}</tbody></table></div>
     <div class="note" style="margin-top:6px">3Y and 5Y annualised.${isStock?" Benchmark: Nifty 500 TRI.":" Percentile: 100 = best."}</div></div>
    <div class="card"><h3>Risk-adjusted (${fin(RS.window)?RS.window.toFixed(1)+"Y":"—"} window, weekly)</h3><div class="kv">
     ${riskKV
      .map(([l,v])=>`<div><div class="l">${l}</div><div class="v">${v}</div></div>`).join("")}</div></div></div>
   <div class="card"><h3>Impact in each scheme</h3><div style="overflow-x:auto"><table><thead><tr><th class="l">Scheme</th><th>Weight</th><th>Value</th><th>Held since</th><th>Since entry</th><th>Bm since entry</th>${DATA.periods.map(p=>`<th>Contrib ${p}</th>`).join("")}<th>Risk share</th><th>Δ Sharpe if removed</th></tr></thead><tbody>
    ${inSch.map(({b,r})=>`<tr><td class="l">${esc(b.name)}</td><td>${pct(r.w,2)}</td><td>${cr(r.mv)}</td><td>${fmtD(r.entry)}</td><td class="${cls(r.since_entry)}">${pct(r.since_entry,1,true)}</td><td>${pct(r.bm_since_entry,1,true)}</td>
     ${DATA.periods.map(p=>`<td class="${cls(r.contrib[p])}">${pp(r.contrib[p])}</td>`).join("")}<td>${pct(r.risk_pct,1)}</td><td class="${cls(-((r.whatif||{}).d_sharpe))}">${fin((r.whatif||{}).d_sharpe)?((r.whatif.d_sharpe>0?"+":"")+r.whatif.d_sharpe.toFixed(3)):"—"}</td></tr>`).join("")}
   </tbody></table></div><div class="note" style="margin-top:6px">Contribution in percentage points of scheme return.</div></div>
   <div class="card"><h3>Health score history (month-ends)</h3><div style="overflow-x:auto"><table><thead><tr><th class="l">Month-end</th>${(s.hist||[]).map(h=>`<th>${new Date(h.d+"T00:00:00").toLocaleDateString("en-IN",{month:"short",year:"2-digit"})}</th>`).join("")}<th>Now</th></tr></thead><tbody>
    <tr><td class="l">Score</td>${(s.hist||[]).map(h=>`<td>${fin(h.s)?h.s.toFixed(0):"—"}</td>`).join("")}<td><b>${fin(s.score)?s.score.toFixed(0):"—"}</b></td></tr>
    ${isStock?"":`<tr><td class="l">1Y category percentile</td>${(s.hist||[]).map(h=>`<td>${fin(h.r)?h.r.toFixed(0):"—"}</td>`).join("")}<td>${fin(RK["1Y"])?RK["1Y"].toFixed(0):"—"}</td></tr>`}
    <tr><td class="l">1Y vs benchmark (pp)</td>${(s.hist||[]).map(h=>`<td class="${cls(h.x)}">${pp(h.x,1)}</td>`).join("")}<td>${pp(fin(R["1Y"])&&fin(B["1Y"])?R["1Y"]-B["1Y"]:null,1)}</td></tr></tbody></table></div></div>
  </div>`;
  d.showModal();
  requestAnimationFrame(()=>{const c=s.chart;if(!c){$("#secChart").innerHTML='<div class="muted">No price history.</div>';return}
    const ser=[{n:"Security",v:c.sec,c:css("--s1")}];if(c.bm)ser.push({n:"Benchmark",v:c.bm,c:css("--s2")});if(c.cat)ser.push({n:"Category",v:c.cat,c:css("--s3")});
    lineChart($("#secChart"),{dates:c.d,series:ser,height:260,baseline:100});
    lineChart($("#ddChart"),{dates:c.d,series:[{n:"Drawdown",v:c.dd,c:css("--s1")}],height:130,baseline:0,yfmt:v=>v.toFixed(0)+"%",endLabels:false});
  });
}
$("#dlg").addEventListener("click",e=>{if(e.target.id==="dlg")e.target.close()});

// ------------------------------------------------------------------ render
function render(){
  document.querySelectorAll("#schemeSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===S.scheme));
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.v===S.view));
  for(const v of ["overview","holdings","impact","exits","method"])$("#v-"+v).classList.toggle("hidden",v!==S.view);
  $(".filters").classList.toggle("hidden",S.view==="method");
  ({overview,holdings,impact,exits,method})[S.view]();
}
render();
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(render,150)});
</script>
